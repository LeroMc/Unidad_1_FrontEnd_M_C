<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SportClub</title>
    <link rel="stylesheet" href="../css/CSSregistro.css">
</head>
<body>
    <header>
        <img src="../imagenes/logo1.png" class="logo" alt="Logo SportClub">
        <h1>REGISTRO DE USUARIO</h1>
    </header>

    <main class="ContenedorCentrado">
        <div class="SeccionFormulario">
            <form id="registroForm">
                <h2>Crea tu cuenta</h2>
                
                <div class="input-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="full_name" placeholder="Tu nombre y apellido" required>
                </div>

                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group-row">
                    <div class="input-group">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" id="birth_date">
                    </div>
                    <div class="input-group">
                        <label>Género</label>
                        <select id="gender">
                            <option value="">Seleccionar...</option>
                            <option value="masculino">Masculino</option>
                            <option value="femenino">Femenino</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="input-group-row">
                    <div class="input-group">
                        <label>¿Practica Deporte?</label>
                        <select id="practica_deporte">
                            <option value="no">No</option>
                            <option value="si">Sí</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Nivel de Experiencia</label>
                        <select id="nivel_experiencia">
                            <option value="principiante">Principiante</option>
                            <option value="intermedio">Intermedio</option>
                            <option value="avanzado">Avanzado</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                </div>

                <div class="input-group">
                    <label>Repetir Contraseña</label>
                    <input type="password" id="confirm_password" placeholder="Confirma tu contraseña" required>
                </div>

                <p id="mensajeError" class="error-text"></p>

                <div class="botones">
                    <button type="button" id="btnRegistrar" class="boton-registro">REGISTRARSE</button>
                    <a href="login.html" class="link-volver">Volver al inicio</a>
                    <a href="recover.html" class="link-volver">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/registro.js"></script>
</body>
</html>

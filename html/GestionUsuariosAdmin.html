<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - SportClub</title>
    <link rel="stylesheet" href="../css/CSSGestionUsuarios.css">
</head>
<body>
    <header>
        <img src="../imagenes/logo1.png" style="width: 350px; height: 100px;" class="logo" alt="Logo">
        <h1>SISTEMA DE GESTIÓN DE USUARIOS</h1>
        <button class="btn-volver" onclick="window.location.href='Admin.html'">⬅ Volver</button>
    </header>

    <main class="main-content-unified">
        <div class="content-header-sketch">
            <h2>Gestión de Usuarios</h2>
            <div class="header-actions-sketch">
                <input type="text" placeholder="Buscar usuario..." class="search-input-sketch">
                <select class="filter-select-sketch">
                    <option>Filtrar por Rol</option>
                    <option value="admin">Admin</option>
                    <option value="coach">Coach</option>
                    <option value="user">User</option>
                </select>
                <button class="btn-nuevo-sketch" id="btnDesplegarNuevo"> + Nuevo Usuario</button>
            </div>
        </div>

        <p class="modulo-desc-sketch">Administra los usuarios del sistema, cambia roles y gestiona permisos.</p>

        <div class="table-container-sketch">
            <table class="table-sketch">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Registro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    </tbody>
            </table>
        </div>

        <section id="seccionNuevoUsuario" class="form-desplegable-sketch hidden">
            <div class="form-header">
                <h3>➕ Registrar Nuevo Usuario</h3>
            </div>
            <form id="formRegistroAdmin" class="grid-form">
                <div class="input-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="reg_name" placeholder="Ej: Juan Pérez"style="border-radius: 4px;">
                    <span class="error-msg" id="err-name"></span>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="reg_email" placeholder="correo@sportclub.cl"style="border-radius: 4px;">
                    <span class="error-msg" id="err-email"></span>
                </div>
                <div class="input-group">
                    <label>Rol</label>
                    <select id="reg_role"style="border-radius: 4px;">
                        <option value="user">User</option>
                        <option value="coach">Coach</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg_pass" placeholder="Mínimo 8 caracteres" style="border-radius: 4px;">
                    <span class="error-msg" id="err-pass"></span>
                </div>
                <div class="input-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="reg_confirm_pass" placeholder="Repetir contraseña" style="border-radius: 4px;">
                    <span class="error-msg" id="err-confirm-pass"></span>
                </div>
                <div class="form-buttons">
                    <button type="button" id="btnGuardar" class="btn-guardar-sketch">Guardar Usuario</button>
                    <button type="button" id="btnCancelar" class="btn-cancelar-sketch" style="border-radius: 4px;">Cancelar</button>
                </div>
            </form>
        </section>
    </main>

    <script src="/js/gestion.js"></script>
</body>
</html>

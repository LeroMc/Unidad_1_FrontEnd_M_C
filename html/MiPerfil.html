<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - SportClub</title>
    <link rel="stylesheet" href="../css/CSSPerfil.css">
</head>
<body>
    <header>
        <img src="../imagenes/logo1.png"style="width: 300px; height: 80px;" class="logo" alt="Logo">
        <h1>MI PERFIL</h1>
        <button class="btn-volver" id="btnVolver">⬅ Volver</button>
    </header>

    <main class="contenedor-perfil">
        <aside class="perfil-sidebar">
            <div class="foto-seccion">
                <img src="../imagenes/logousuario.webp" alt="Usuario" id="profilePic">
                <h2 id="sideName">Nombre Usuario</h2>
                <span class="badge" id="sideRole">User</span>
            </div>
            <div class="info-lista">
                <div class="info-item">
                    <span class="info-icon">📧</span>
                    <div class="info-copy">
                        <span class="info-label">Email</span>
                        <span class="info-value" id="sideEmail">---</span>
                    </div>
                </div>
                <div class="info-item">
                    <span class="info-icon">🎂</span>
                    <div class="info-copy">
                        <span class="info-label">Fecha de nacimiento</span>
                        <span class="info-value" id="sideBirth">---</span>
                    </div>
                </div>
                <div class="info-item">
                    <span class="info-icon">🛡️</span>
                    <div class="info-copy">
                        <span class="info-label">Rol</span>
                        <span class="info-value">User</span>
                    </div>
                </div>
                <div class="info-item">
                    <span class="info-icon">📅</span>
                    <div class="info-copy">
                        <span class="info-label">Registro</span>
                        <span class="info-value" id="sideRegister">---</span>
                    </div>
                </div>
            </div>
        </aside>

        <section class="perfil-main">
            <div class="caja-blanca">
                <div class="header-caja">
    <button type="button" id="btnHabilitarEdicion" class="btn-editar-perfil">✏️ Editar Perfil</button>
</div>
                <h3>Información Personal</h3>
                <form id="formInfoPersonal" class="grid-perfil">
                    <div class="campo">
                        <label>Nombre Completo</label>
                        <input type="text" id="editName">
                    </div>
                    <div class="campo">
                        <label>Email</label>
                        <input type="email" id="editEmail">
                    </div>
                    <div class="campo">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" id="editBirth">
                    </div>
                    <div class="campo">
                        <label>Deporte Favorito</label>
                        <input type="text" id="editSport" placeholder="Ej: Fútbol, Natación...">
                    </div>
                    <div class="campo-full">
                        <label>Intereses / Biografía</label>
                        <textarea id="editBio" rows="3" placeholder="Cuéntanos un poco sobre ti..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-guardar" id="btnGuardarInfo">Guardar Cambios</button>
                    </div>
                </form>
            </div>

            <div class="caja-blanca">
                <h3>Seguridad / Cambiar Contraseña</h3>
                <form id="formPass" class="grid-perfil">
                    <div class="campo">
                        <label>Contraseña Actual</label>
                        <input type="password" id="oldPass" placeholder="********">
                    </div>
                    <div class="campo">
                        <label>Nueva Contraseña</label>
                        <input type="password" id="newPass" placeholder="Mínimo 8 caracteres">
                    </div>
                    <div class="campo">
                        <label>Confirmar Nueva Contraseña</label>
                        <input type="password" id="confirmNewPass" placeholder="Repetir nueva">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-actualizar-pass" id="btnUpdatePass">Actualizar Contraseña</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="../js/perfil.js"></script>
</body>
</html>
